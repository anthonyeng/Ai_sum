<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Summarizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="spinner-overlay" id="spinnerOverlay">
    <div class="spinner"></div>
    <div class="spinner-text" id="spinnerText">Processing...</div>
    <div class="spinner-sub" id="spinnerSub"></div>
  </div>
  <div class="toast" id="toast"></div>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">VS</div>
        <div>
          <div class="sidebar-title">Video Summarizer</div>
          <div class="sidebar-sub">ML-powered analysis</div>
        </div>
      </div>
      <button class="new-chat-btn" onclick="newChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <!-- Main -->
    <div class="main">

      <!-- Chat messages -->
      <div class="chat-area" id="chatArea">
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          </div>
          <div class="chat-empty-text">Upload a video or paste a YouTube URL</div>
          <div class="chat-empty-sub">Get a video summary or text analysis</div>
        </div>
      </div>

      <!-- Input bar -->
      <div class="input-bar">
        <div class="input-bar-inner">
          <div id="fileTag" class="input-file-tag hidden">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <span id="fileTagName"></span>
            <button onclick="clearFile()">&times;</button>
          </div>
          <div class="input-row">
            <div class="input-wrap">
              <button class="input-file-btn" id="fileBtn" onclick="document.getElementById('videoInput').click()" title="Upload video">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </button>
              <input type="file" id="videoInput" accept="video/mp4" hidden />
              <input type="text" class="input-field" id="urlInput" placeholder="Paste YouTube URL or upload a file..." />
            </div>
            <button class="action-btn video-btn" id="videoBtn" disabled onclick="doSummarize('video')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              Video
            </button>
            <button class="action-btn text-btn" id="textBtn" disabled onclick="doSummarize('text')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
              Text
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const BASE = "";
    let currentChatId = null;
    let selectedFile = null;
    let busy = false;

    function showToast(m,t="error"){const e=document.getElementById("toast");e.textContent=m;e.className=`toast toast-${t} active`;clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("active"),3500)}
    function showSpinner(t,s){document.getElementById("spinnerText").textContent=t;document.getElementById("spinnerSub").textContent=s||"";document.getElementById("spinnerOverlay").classList.add("active")}
    function hideSpinner(){document.getElementById("spinnerOverlay").classList.remove("active")}

    // ── File handling ──────────────────────────────────────────────────────
    document.getElementById("videoInput").addEventListener("change", e => {
      const f = e.target.files[0];
      if (!f) return;
      if (!f.name.toLowerCase().endsWith(".mp4")) { showToast("Only .mp4 files"); return; }
      if (f.size > 500*1024*1024) { showToast("Max 500 MB"); return; }
      selectedFile = f;
      document.getElementById("fileTagName").textContent = f.name;
      document.getElementById("fileTag").classList.remove("hidden");
      document.getElementById("fileBtn").classList.add("has-file");
      updateBtns();
    });

    function clearFile() {
      selectedFile = null;
      document.getElementById("videoInput").value = "";
      document.getElementById("fileTag").classList.add("hidden");
      document.getElementById("fileBtn").classList.remove("has-file");
      updateBtns();
    }

    document.getElementById("urlInput").addEventListener("input", updateBtns);

    function updateBtns() {
      const hasInput = selectedFile || document.getElementById("urlInput").value.trim().length > 5;
      document.getElementById("videoBtn").disabled = !hasInput || busy;
      document.getElementById("textBtn").disabled = !hasInput || busy;
    }

    // ── Chat CRUD ──────────────────────────────────────────────────────────
    async function loadChats() {
      try {
        const r = await fetch(`${BASE}/chats`);
        const chats = await r.json();
        const list = document.getElementById("chatList");
        list.innerHTML = "";
        chats.forEach(c => {
          const el = document.createElement("div");
          el.className = `chat-item${c.id === currentChatId ? " active" : ""}`;
          el.innerHTML = `
            <div class="chat-item-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
            <div class="chat-item-text">
              <div class="chat-item-title">${esc(c.title)}</div>
              <div class="chat-item-date">${new Date(c.created_at).toLocaleDateString()}</div>
            </div>
            <button class="chat-item-delete" onclick="event.stopPropagation();deleteChat(${c.id})">&times;</button>
          `;
          el.onclick = () => openChat(c.id);
          list.appendChild(el);
        });
      } catch {}
    }

    async function newChat() {
      try {
        const r = await fetch(`${BASE}/chats`, { method: "POST" });
        const c = await r.json();
        currentChatId = c.id;
        await loadChats();
        renderMessages([]);
      } catch { showToast("Failed to create chat"); }
    }

    async function openChat(id) {
      currentChatId = id;
      await loadChats();
      try {
        const r = await fetch(`${BASE}/chats/${id}`);
        const data = await r.json();
        renderMessages(data.messages || []);
      } catch { showToast("Failed to load chat"); }
    }

    async function deleteChat(id) {
      try {
        await fetch(`${BASE}/chats/${id}`, { method: "DELETE" });
        if (currentChatId === id) { currentChatId = null; renderMessages([]); }
        await loadChats();
      } catch { showToast("Failed to delete"); }
    }

    // ── Render messages ────────────────────────────────────────────────────
    function renderMessages(messages) {
      const area = document.getElementById("chatArea");
      const empty = document.getElementById("chatEmpty");
      if (!messages.length) {
        area.innerHTML = "";
        area.appendChild(empty);
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");
      area.innerHTML = "";
      messages.forEach(m => {
        if (m.role === "user") area.appendChild(renderUserMsg(m));
        else area.appendChild(renderAIMsg(m));
      });
      area.scrollTop = area.scrollHeight;
    }

    function renderUserMsg(m) {
      const d = document.createElement("div");
      d.className = "msg";
      const c = m.content || {};
      let body = "";
      if (c.filename) body = `<div class="msg-file"><span class="msg-file-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></span><span class="msg-file-name">${esc(c.filename)}</span></div>`;
      else if (c.url) body = `<div class="msg-content"><p>${esc(c.url)}</p></div>`;
      d.innerHTML = `<div class="msg-avatar user">You</div><div class="msg-body"><div class="msg-label">You</div>${body}</div>`;
      return d;
    }

    function renderAIMsg(m) {
      const d = document.createElement("div");
      d.className = "msg";
      const c = m.content || {};
      let body = "";

      if (m.message_type === "text_result") {
        let sections = `<p>${esc(c.summary || "")}</p>`;
        if (c.transcript) sections += `<div class="summary-section"><div class="summary-section-label">Transcript</div><div class="summary-transcript">${esc(c.transcript)}</div></div>`;
        if (c.stats) sections += `<div class="summary-stats">${Object.entries(c.stats).map(([k,v])=>`<div class="summary-stat"><div class="summary-stat-val">${v}</div><div class="summary-stat-label">${k.replace(/_/g," ")}</div></div>`).join("")}</div>`;
        sections += `<details class="summary-json"><summary>View JSON</summary><pre>${esc(JSON.stringify(c,null,2))}</pre></details>`;
        body = `<div class="summary-card"><div class="summary-header"><span class="summary-tag text">Text</span><span class="summary-title">${esc(c.title || "Summary")}</span></div><div class="summary-body">${sections}</div></div>`;
      } else if (m.message_type === "video_result") {
        body = `<div class="summary-card"><div class="summary-header"><span class="summary-tag video">Video</span><span class="summary-title">Video Summary</span></div><div class="summary-body"><p>Video summary generated successfully.</p></div></div>`;
      } else {
        body = `<div class="msg-content"><p>${esc(c.text || JSON.stringify(c))}</p></div>`;
      }

      d.innerHTML = `<div class="msg-avatar ai">AI</div><div class="msg-body"><div class="msg-label">AI Video Summarizer</div>${body}</div>`;
      return d;
    }

    function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    // ── Summarize ──────────────────────────────────────────────────────────
    async function doSummarize(mode) {
      if (busy) return;
      const url = document.getElementById("urlInput").value.trim();
      if (!selectedFile && url.length < 5) return;

      // Create chat if needed
      if (!currentChatId) await newChat();

      busy = true;
      updateBtns();
      const isUrl = !selectedFile && url.length > 5;
      showSpinner(mode === "video" ? "Generating video summary..." : "Analyzing video...",
        isUrl ? "Downloading from YouTube..." : "Processing uploaded file...");

      // Add user message
      const userContent = isUrl ? { url } : { filename: selectedFile.name, size: selectedFile.size };
      addMsgToUI("user", userContent);

      try {
        let res;
        if (isUrl) {
          res = await fetch(`${BASE}/url-summarize`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, mode, chat_id: currentChatId }),
          });
        } else {
          const form = new FormData();
          form.append("video", selectedFile);
          form.append("chat_id", currentChatId);
          const endpoint = mode === "video" ? "/summarize" : "/text-summarize";
          res = await fetch(`${BASE}${endpoint}`, { method: "POST", body: form });
        }

        if (mode === "video" && res.ok) {
          const blob = await res.blob();
          const objUrl = URL.createObjectURL(blob);
          addVideoResultToUI(objUrl);
          showToast("Video summary ready!", "success");
        } else if (mode === "text") {
          const data = await res.json();
          if (!res.ok) { showToast(data.error || "Failed"); }
          else { addTextResultToUI(data); showToast("Text summary ready!", "success"); }
        } else if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          showToast(d.error || "Failed");
        }
      } catch (err) { showToast(err.message); }
      finally {
        hideSpinner();
        busy = false;
        updateBtns();
        clearFile();
        document.getElementById("urlInput").value = "";
        loadChats();
      }
    }

    function addMsgToUI(role, content) {
      const area = document.getElementById("chatArea");
      document.getElementById("chatEmpty").classList.add("hidden");
      const m = { role, content, message_type: role === "user" ? "input" : "result" };
      area.appendChild(role === "user" ? renderUserMsg(m) : renderAIMsg(m));
      area.scrollTop = area.scrollHeight;
    }

    function addTextResultToUI(data) {
      const area = document.getElementById("chatArea");
      const m = { role: "assistant", content: data, message_type: "text_result" };
      area.appendChild(renderAIMsg(m));
      area.scrollTop = area.scrollHeight;
    }

    function addVideoResultToUI(objUrl) {
      const area = document.getElementById("chatArea");
      const d = document.createElement("div");
      d.className = "msg";
      d.innerHTML = `
        <div class="msg-avatar ai">AI</div>
        <div class="msg-body">
          <div class="msg-label">AI Video Summarizer</div>
          <div class="summary-card">
            <div class="summary-header"><span class="summary-tag video">Video</span><span class="summary-title">Video Summary</span></div>
            <div class="summary-body">
              <video class="video-player" controls src="${objUrl}"></video>
              <button class="btn-download" onclick="(()=>{const a=document.createElement('a');a.href='${objUrl}';a.download='summary.mp4';a.click()})()">Download Summary</button>
            </div>
          </div>
        </div>`;
      area.appendChild(d);
      area.scrollTop = area.scrollHeight;
    }

    // ── Init ────────────────────────────────────────────────────────────────
    loadChats();
  </script>
</body>
</html>
